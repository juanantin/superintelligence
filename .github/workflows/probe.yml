name: Probe token flows

# Diagnostic, run by hand. The sandbox these changes are written in has no
# route to Base, DexScreener or GeckoTerminal, so the one question that
# matters — which token the rewards are actually paid in, and whether
# anything will price it — can only be asked from a runner that has network.
#
# Actions ▸ Probe token flows ▸ Run workflow, then read the job log.

on:
  # Also on push, because the token that drives this session cannot dispatch
  # a workflow by hand — touching either file below is how it gets run.
  push:
    paths:
      - scripts/probe.mjs
      - scripts/page-probe.mjs
      - scripts/panel-probe.mjs
      - .github/workflows/probe.yml
      # The page probe exists to test these two, so a change to either is
      # exactly when it should run.
      - assets/js/app.js
      - config.js
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Base RPC endpoint
        required: false
        default: https://mainnet.base.org
      start_block:
        description: First block to scan (blank = config.js launchBlock)
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The other half of the question: not what the chain holds, but what the
      # page does with it. Runs the committed site in a real browser, against
      # the real network, and prints the tiles.
      - name: Probe the page
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/page-probe.mjs

      # The same page, but starting from a browser that already banked zeros —
      # the state a returning visitor is in, and the one a fresh run cannot
      # reach. Fails the build if a seeded zero is still on screen at the end.
      - name: Probe the page as a returning visitor
        env:
          SEED_ZEROS: '1'
        run: node scripts/page-probe.mjs

      # A phone, cold. The report that prompted this was "showing — on
      # mobile", and a desktop run cannot see it: the difference is an empty
      # cache and a tab nobody keeps in front for a minute.
      - name: Probe the page as a phone
        env:
          MOBILE: '1'
        run: node scripts/page-probe.mjs

      # Reading these logs through the API returns only the TAIL of the job,
      # and the browser steps are thousands of lines of CORS and retry noise —
      # so anything printed first is unreadable by the time anyone asks for
      # it. The two steps whose output is meant to be quoted go last.
      - name: Probe the chain
        env:
          RPC_URL: ${{ inputs.rpc_url }}
          START_BLOCK: ${{ inputs.start_block }}
        run: node scripts/probe.mjs

      # Last of all: what the platform itself publishes, printed beside what
      # this site publishes. A chain scan cannot check its own assumptions —
      # which flow is "fees", and what share of the outflow reaches holders —
      # and those are the assumptions that turn a correct measurement into a
      # wrong tile.
      - name: Read the platform's own panels
        if: always()
        run: node scripts/panel-probe.mjs

      # LAST, and the reason is the paragraph above: this step's output is the
      # one nobody had ever read. It sat seventh of nine, under two thousand
      # lines of browser noise, and the API returns only the tail.
      #
      # It also waits for the deploy first. Vercel builds AFTER the push that
      # triggered this run, so probing immediately reads the PREVIOUS build
      # and reports a pass for code that is not live — which is precisely the
      # failure the step exists to catch, dressed up as a success. So it polls
      # config.js until the version it serves is the version this commit
      # carries, and says which one it got either way.
      - name: Probe the live site
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://purr-puce.vercel.app' }}
        run: |
          set -uo pipefail
          WANT=$(node -e "
            const fs=require('fs'); const w={};
            new Function('window', fs.readFileSync('config.js','utf8'))(w);
            process.stdout.write(String(w.SITE_CONFIG.version));
          ")
          echo "this commit is build ${WANT}; waiting for ${SITE_URL} to serve it"
          GOT=''
          for i in $(seq 1 40); do
            GOT=$(curl -sS --max-time 15 "${SITE_URL}/config.js?probe=$i" \
                  | sed -n "s/.*version: *'\([0-9]*\)'.*/\1/p" | head -1)
            if [ "$GOT" = "$WANT" ]; then echo "build ${GOT} is live after ~$((i*6))s"; break; fi
            sleep 6
          done
          if [ "$GOT" != "$WANT" ]; then
            echo "⚠ still serving build '${GOT}' after 240s, not '${WANT}'."
            echo "  The probe below therefore describes the PREVIOUS deploy."
          fi
          node scripts/page-probe.mjs
