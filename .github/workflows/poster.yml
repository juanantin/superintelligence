name: Prepare the hero clip

# Two jobs in one, both of which this sandbox cannot do — its Chromium is
# built without H.264 and it has no ffmpeg at all:
#
#   1. STRIP THE AUDIO. The hero is muted and looping, so the AAC track is
#      weight every visitor downloads and nobody can ever hear. The video
#      stream is COPIED, not re-encoded, so the picture stays bit-identical.
#
#   2. CUT THE POSTER from the clip's OWN FIRST FRAME. A <video> shows nothing
#      until it has buffered — on a cold phone that is a blank hole where the
#      wordmark should be. And it must be frame 0, not a nearby keyframe:
#      poster and first frame have to be the same picture or the hand-off to
#      playback visibly jumps.
#
# Run by pushing to this file or to the clip.

on:
  push:
    branches: [main]
    paths:
      - images/si_video.mp4
      - images/si_teaser.mp4
      - .github/workflows/poster.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not on the runner image any more — it was dropped from ubuntu-latest
      # during 2025. apt rather than a third-party action: one package.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: What the clip actually is
        run: |
          set -euo pipefail
          ffprobe -hide_banner -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate \
            -show_entries format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 images/si_video.mp4

      - name: First frame -> images/hero_poster.webp
        run: |
          set -euo pipefail
          # -frames:v 1 with NO -ss: the first frame, not a nearby keyframe.
          ffmpeg -y -hide_banner -loglevel error -i images/si_video.mp4 \
                 -frames:v 1 -c:v libwebp -quality 88 -compression_level 6 \
                 images/hero_poster.webp
          ls -l images/hero_poster.webp

      # The teaser gets a poster too, but KEEPS its audio: it is 29 seconds of
      # content played on a click, not muted wallpaper, so the sound is the
      # point rather than dead weight.
      - name: Teaser first frame -> images/teaser_poster.webp
        run: |
          set -euo pipefail
          if [ -f images/si_teaser.mp4 ]; then
            ffmpeg -y -hide_banner -loglevel error -i images/si_teaser.mp4 \
                   -frames:v 1 -c:v libwebp -quality 88 -compression_level 6 \
                   images/teaser_poster.webp
            ls -l images/teaser_poster.webp
          else
            echo "no teaser present"
          fi

      - name: Drop the audio track
        run: |
          set -euo pipefail
          before=$(stat -c%s images/si_video.mp4)
          # -c:v copy: the picture is not re-encoded. +faststart puts the moov
          # atom first so a browser can begin before the file has arrived.
          ffmpeg -y -hide_banner -loglevel error -i images/si_video.mp4 \
                 -c:v copy -an -movflags +faststart /tmp/si_video.mp4
          after=$(stat -c%s /tmp/si_video.mp4)
          echo "before $before bytes, after $after bytes, saved $(( (before-after)/1024 )) KB"
          mv /tmp/si_video.mp4 images/si_video.mp4

      - name: Commit
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/
          if git diff --cached --quiet -- images/; then echo "no change"; exit 0; fi
          git commit -m "chore: cut the hero poster and strip the clip's audio [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then echo "pushed"; exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep $((attempt * 3))
          done
          exit 1
