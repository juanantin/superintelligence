name: Fetch the quoted X posts

# The wall quotes real accounts, so each card's text, author and date have to
# come from the post itself. The sandbox this site is written in cannot reach
# x.com — the egress proxy blocks it outright — so the fetch happens here,
# where there is a route, and anything that cannot be fetched produces NO card
# rather than an invented one.
#
# Edit data/post-urls.json to change which posts appear.

on:
  push:
    branches: [main]
    paths:
      - data/post-urls.json
      - scripts/fetch-posts.mjs
      - .github/workflows/posts.yml
  schedule:
    # Once a day is plenty: a post's text does not change, and this only needs
    # to re-run to pick up a deletion or an edited URL list.
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium

      - name: Fetch each post
        run: node scripts/fetch-posts.mjs

      - name: Commit if anything changed
        run: |
          set -u
          if git diff --quiet -- data/posts.json; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/p && cp data/posts.json /tmp/p/
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/p/posts.json data/
            if git diff --quiet -- data/posts.json; then echo "remote already current"; exit 0; fi
            git add data/posts.json
            git commit -m "chore: refresh quoted posts [skip ci]"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then echo "pushed on attempt $attempt"; exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
