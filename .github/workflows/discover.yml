name: Discover token facts

# What config.js needs but a sandbox cannot look up: the pool, the reward
# token and its decimals, the launch block, and whatever the platform routed
# this token's fees to. Runs on a GitHub runner because that is the only
# machine in this loop with a route to Base, DexScreener and the platform API.
#
# Push to either path below to run it — the token this session holds gets 403
# from workflow_dispatch, so a push to a watched path is the trigger.

on:
  push:
    paths:
      - scripts/discover-token.mjs
      - .github/workflows/discover.yml
  workflow_dispatch:
    inputs:
      token:
        description: Token contract address (blank = config.js contractAddress)
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ask the network
        env:
          TOKEN: ${{ inputs.token }}
          RPC_URL: ${{ secrets.RPC_URL }}
          # Addresses to test as the distributor: the reward token should flow
          # both in and out of the real one. Comma-separated.
          #
          # This is the index the OWNER's Stockify link names for $SI. It is
          # seeded here rather than written straight into config.js so this run
          # reports whether the reward token really flows both IN and OUT of it
          # before the site treats it as the distributor. An index that only
          # receives, or only sends, is not the thing holders are paid from.
          CANDIDATES: '0x4e2e072c38735bd0b9374f429cf0ae1c07412450'
        run: node scripts/discover-token.mjs

      # Every ERC-20 that has actually moved in or out of the rewards index.
      # This token's index does NOT pay in one token: its Stockify panel reads
      # "6 names, fixed at creation" and lists payouts in NVDAc, AAPLc, GOOGLc,
      # AMZNc, SPCXc and TSLAc, while fees arrive as ETH. So the template's
      # one-reward-token assumption does not hold here, and the six payout
      # tokens' contract addresses have to be read off the chain before any
      # per-name figure can be indexed. This prints them with totals.
      - name: What actually moves through the index
        env:
          RPC_URL: ${{ secrets.RPC_URL || 'https://mainnet.base.org' }}
        run: node scripts/discover-flows.mjs
